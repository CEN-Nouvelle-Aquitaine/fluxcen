# URLs des ressources téléchargées par le plugin.
#
# Chaque clé accepte indifféremment :
#   1. Un lien de partage SharePoint collé TEL QUEL depuis « Partager > Copier le lien »
#      (avec ses paramètres ?d=…&csf=1&web=1&e=…) — le plugin le résout automatiquement
#      via l'authentification Microsoft configurée dans QGIS.
#      Pour `styles_couches`, le lien de partage peut désigner un DOSSIER : les fichiers
#      .qml sont résolus par leur nom à l'intérieur du dossier partagé.
#   2. Une URL Microsoft Graph historique
#      (ex. https://graph.microsoft.com/v1.0/sites/<site-id>/drive/root:/fluxcen/flux.csv:/content)
#   3. Une URL HTTPS publique quelconque — téléchargée SANS authentification Microsoft.
#
# Note : l'authentification Microsoft n'est appliquée qu'aux domaines *.sharepoint.com et
# graph.microsoft.com. Les URL http:// sont refusées.
# (Le nom de clé `github_urls` est historique — les ressources peuvent être hébergées ailleurs.)
github_urls:
  flux_csv: "https://<tenant>.sharepoint.com/:x:/r/personal/<compte>/Documents/<chemin>/flux.csv?d=w…&csf=1&web=1&e=…"
  styles_couches: "https://<tenant>.sharepoint.com/:f:/r/personal/<compte>/Documents/<chemin>/styles_couches?csf=1&web=1&e=…"

# Authentification pour l'accès aux ressources privées — clé OPTIONNELLE.
# Le plugin découvre automatiquement la configuration Microsoft dans le gestionnaire
# d'authentification QGIS (Préférences > Authentification) : l'unique configuration de type
# web (OAuth2 — Microsoft Entra ID, app "public client/native", redirect http://localhost:7070,
# permission déléguée Files.Read.All / Sites.Read.All). La configuration distribuée au CEN
# conserve son identifiant à l'import : aucune saisie n'est nécessaire ici.
# `authcfg` = surcharge explicite (identifiant 7 caractères) : prioritaire si renseignée,
# utile seulement si plusieurs configurations web coexistent dans QGIS.
# Sans aucune configuration web : accès anonyme, valable uniquement pour des URL publiques
# hors Microsoft (hébergement public type GitHub). Une URL SharePoint ou Microsoft Graph
# exige toujours une authentification — l'API Microsoft n'accepte pas d'accès anonyme en
# tenant d'entreprise ; sans configuration le plugin refuse la requête avec un message explicite.
auth:
  authcfg: ""
