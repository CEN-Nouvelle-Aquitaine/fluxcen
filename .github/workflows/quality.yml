name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Git Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: .github/workflows/quality.yml

      - name: Install Python dependencies
        run: pip install pylint pyyaml

      - name: Cache apt packages
        id: apt-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ runner.os }}-pyqt5-dev-tools-v1

      - name: Install pyqt5-dev-tools
        run: |
          CACHE_DIR="$HOME/.cache/apt-archives"
          mkdir -p "$CACHE_DIR"
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" == "true" ]; then
            sudo cp -n "$CACHE_DIR"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get install -y --no-install-recommends pyqt5-dev-tools
          sudo cp -n /var/cache/apt/archives/*.deb "$CACHE_DIR/" 2>/dev/null || true
          sudo chown -R "$USER" "$CACHE_DIR"

      - name: Lint — pylint
        id: pylint
        continue-on-error: true
        run: |
          pylint --recursive=y . \
            --reports=n \
            --rcfile=pylintrc \
            --disable=E0401 2>&1 | tee /tmp/pylint.log

      - name: Metadata — validate version format
        id: metadata
        continue-on-error: true
        run: python .github/scripts/check_metadata.py 2>&1 | tee /tmp/metadata.log

      - name: YAML — validate example files and detect committed configs
        id: yaml_check
        continue-on-error: true
        run: python .github/scripts/check_yaml.py 2>&1 | tee /tmp/yaml.log

      - name: Security — gitleaks scan
        id: gitleaks
        continue-on-error: true
        run: |
          GITLEAKS_VERSION=8.18.4
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" \
            -o "/tmp/${ARCHIVE}"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${CHECKSUMS}" \
            -o "/tmp/${CHECKSUMS}"
          (cd /tmp && sha256sum --check --ignore-missing "${CHECKSUMS}")
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks detect --source . --log-opts="origin/main..HEAD" 2>&1 | tee /tmp/gitleaks.log

      - name: Resources — validate .qrc and check resources.py sync
        id: resources
        continue-on-error: true
        run: python .github/scripts/check_resources.py 2>&1 | tee /tmp/resources.log

      - name: Summary
        if: always()
        run: |
          status() {
            case "$1" in
              success) echo "OK" ;;
              failure) echo "Problèmes détectés" ;;
              skipped) echo "Ignoré" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "## État des lieux qualité"
            echo ""
            echo "| Étape | Statut |"
            echo "|---|---|"
            echo "| Lint — pylint | $(status '${{ steps.pylint.outcome }}') |"
            echo "| Metadata | $(status '${{ steps.metadata.outcome }}') |"
            echo "| YAML | $(status '${{ steps.yaml_check.outcome }}') |"
            echo "| Security — gitleaks | $(status '${{ steps.gitleaks.outcome }}') |"
            echo "| Resources | $(status '${{ steps.resources.outcome }}') |"
            echo ""
            for log in pylint metadata yaml gitleaks resources; do
              if [ -f "/tmp/${log}.log" ]; then
                echo "<details><summary>Détails — ${log}</summary>"
                echo ""
                echo '```'
                cat "/tmp/${log}.log"
                echo '```'
                echo ""
                echo "</details>"
                echo ""
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
