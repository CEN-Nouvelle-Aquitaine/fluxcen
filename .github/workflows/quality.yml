name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      LOG_DIR: /tmp/quality
    defaults:
      run:
        shell: bash

    steps:
      - name: Git Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: .github/workflows/quality.yml

      - name: Install Python dependencies
        run: pip install pylint pyyaml

      - name: Cache apt packages
        id: apt-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ runner.os }}-pyqt5-dev-tools-v1

      - name: Install pyqt5-dev-tools
        run: |
          CACHE_DIR="$HOME/.cache/apt-archives"
          mkdir -p "$CACHE_DIR"
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" == "true" ]; then
            sudo cp -n "$CACHE_DIR"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get install -y --no-install-recommends pyqt5-dev-tools
          sudo cp -n /var/cache/apt/archives/*.deb "$CACHE_DIR/" 2>/dev/null || true
          sudo chown -R "$USER" "$CACHE_DIR"

      - name: Prepare quality output dir
        run: mkdir -p "$LOG_DIR"

      - name: Lint — pylint
        id: pylint
        continue-on-error: true
        run: |
          pylint --recursive=y . \
            --reports=n \
            --rcfile=pylintrc \
            --disable=E0401 2>&1 | tee "$LOG_DIR/pylint.log"

      - name: Metadata — validate version format
        id: metadata
        continue-on-error: true
        run: python .github/scripts/check_metadata.py 2>&1 | tee "$LOG_DIR/metadata.log"

      - name: YAML — validate example files and detect committed configs
        id: yaml_check
        continue-on-error: true
        run: python .github/scripts/check_yaml.py 2>&1 | tee "$LOG_DIR/yaml_check.log"

      - name: Security — gitleaks scan
        id: gitleaks
        continue-on-error: true
        run: |
          GITLEAKS_VERSION=8.18.4
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" \
            -o "/tmp/${ARCHIVE}"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${CHECKSUMS}" \
            -o "/tmp/${CHECKSUMS}"
          (cd /tmp && sha256sum --check --ignore-missing "${CHECKSUMS}")
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          mkdir -p "$HOME/.local/bin"
          mv /tmp/gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" detect --source . --log-opts="origin/main..HEAD" 2>&1 | tee "$LOG_DIR/gitleaks.log"

      - name: Resources — validate .qrc and check resources.py sync
        id: resources
        continue-on-error: true
        run: python .github/scripts/check_resources.py 2>&1 | tee "$LOG_DIR/resources.log"

      - name: Summary
        if: always()
        env:
          OUTCOME_pylint: ${{ steps.pylint.outcome }}
          OUTCOME_metadata: ${{ steps.metadata.outcome }}
          OUTCOME_yaml_check: ${{ steps.yaml_check.outcome }}
          OUTCOME_gitleaks: ${{ steps.gitleaks.outcome }}
          OUTCOME_resources: ${{ steps.resources.outcome }}
        run: python .github/scripts/build_summary.py >> "$GITHUB_STEP_SUMMARY"
